name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    # A test that blocks on a terminal would otherwise run until the six-hour
    # default, so every job fails fast instead.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # On macOS the gcc command is a Clang driver, so it adds no coverage.
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: make check CC=${{ matrix.compiler }} CFLAGS="-O2 -Werror"

  # LeakSanitizer is unavailable on macOS, so this job stays on Linux.
  sanitizers:
    name: Test (clang, ASan and UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: make check-sanitize CC=clang CFLAGS="-O1 -Werror"
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned to the major version used for .clang-format; other versions may
      # wrap lines differently. Both 24.04 and 26.04 ship this package.
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: clang-format-18 --dry-run -Werror src/*.c src/*.h tests/*.c tests/*.h
