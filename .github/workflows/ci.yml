name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Makefile sets CFLAGS with "+=", so a CFLAGS given on the command line
# replaces the defaults. Each job therefore repeats the default flags.
env:
  BASE_CFLAGS: -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror

jobs:
  test:
    name: Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: make check CC=${{ matrix.compiler }} CFLAGS="$BASE_CFLAGS"

  sanitizers:
    name: Test (clang, ASan and UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: >
          make check CC=clang
          CFLAGS="-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=address,undefined"
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the major version used for .clang-format; other versions may
      # wrap lines differently. Both 24.04 and 26.04 ship this package.
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: clang-format-18 --dry-run -Werror src/*.c src/*.h tests/*.c tests/*.h
